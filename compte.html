<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kayam · Mon compte</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F5F6F1">
<link rel="icon" href="img/logo.png">
<link rel="stylesheet" href="site.css">
<style>
  main.wide { max-width:1040px; }
  .hidden { display:none !important; }
  form.login { display:flex; flex-direction:column; gap:10px; }
  .field { width:100%; border:1.5px solid var(--line); background:var(--white); border-radius:16px; padding:15px 16px; font:inherit; color:var(--dark); outline:0; }
  .field:focus { border-color:var(--dark); }
  button.btn { width:100%; border:0; cursor:pointer; font-family:inherit; margin:6px 0 0; }
  button.btn:disabled { opacity:.6; cursor:default; }
  .link { background:none; border:0; padding:6px 0; font:inherit; font-weight:700; color:var(--green); cursor:pointer; text-decoration:underline; }
  .oauth { display:flex; flex-direction:column; gap:10px; margin-bottom:18px; }
  .oauth button { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; border-radius:999px; padding:16px; font:inherit;
                  font-weight:800; font-size:17px; cursor:pointer; border:1.5px solid var(--dark); }
  .oauth .apple { background:var(--dark); color:var(--white); }
  .oauth .google { background:var(--white); color:var(--dark); }
  .or { display:flex; align-items:center; gap:12px; color:var(--sage); font-size:14px; margin:4px 0 14px; }
  .or::before, .or::after { content:""; flex:1; border-top:1px solid var(--line); }
  .msg { min-height:22px; font-weight:700; font-size:15px; margin:8px 0 0; }
  .msg.ok { color:var(--green); } .msg.err { color:#B3261E; }
  .stats { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:12px; margin:8px 0 28px; }
  .stat { background:var(--card); color:#F2F5EE; border-radius:22px; padding:18px; }
  .stat small { display:block; color:#A3ADA4; font-size:13px; font-weight:700; }
  .stat b { display:block; font-size:30px; letter-spacing:-.04em; font-weight:900; margin:4px 0 2px; font-variant-numeric:tabular-nums; }
  .stat b.l { color:var(--lime); }
  .stat span { color:#A3ADA4; font-size:13px; }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; background:rgba(17,22,15,.06); padding:5px; border-radius:999px; margin:0 0 18px; }
  .tabs button { border:0; background:none; font:inherit; font-weight:700; font-size:15px; padding:9px 16px; border-radius:999px; cursor:pointer; color:var(--sage); }
  .tabs button.on { background:var(--white); color:var(--dark); box-shadow:0 2px 8px rgba(17,22,15,.08); }
  .sess h3 { font-size:18px; letter-spacing:-.02em; margin:0; }
  .sess .when { color:var(--sage); font-size:14px; margin:2px 0 10px; }
  .ex { display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-top:1px solid var(--line); font-size:15px; }
  .ex b { font-weight:700; }
  .ex span { color:var(--sage); text-align:right; font-variant-numeric:tabular-nums; }
  table.data { background:var(--white); border-radius:22px; overflow:hidden; box-shadow:0 1px 0 var(--line), 0 10px 30px rgba(17,22,15,.06); }
  table.data th, table.data td { padding:12px 16px; }
  table.data td.n, table.data th.n { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .chart { background:var(--white); border-radius:22px; padding:16px; margin-bottom:14px; box-shadow:0 1px 0 var(--line), 0 10px 30px rgba(17,22,15,.06); }
  .chart svg { width:100%; height:220px; display:block; }
  .empty { color:var(--sage); background:var(--white); border-radius:22px; padding:22px; }
  .row2 { display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; }
  .synced { color:var(--sage); font-size:14px; }
  /* Le compte, comme l'onglet Progrès de l'app */
  .prof { display:flex; align-items:center; gap:22px; margin-bottom:22px; }
  .avatar { width:104px; height:104px; flex:none; border-radius:50%; background:var(--lime); color:var(--ink); display:flex; align-items:center;
            justify-content:center; font-size:44px; font-weight:900; overflow:hidden; box-shadow:0 0 0 4px var(--cream), 0 0 0 6px #A8BC8C; }
  .avatar img { width:100%; height:100%; object-fit:cover; }
  .who h1 { margin:0 0 6px; } .who h1 span { color:var(--green); }
  .who .sub { margin:0; font-size:17px; }
  .pstats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px; }
  .pstats div { text-align:center; } .pstats b { display:block; font-size:30px; font-weight:900; letter-spacing:-.04em; font-variant-numeric:tabular-nums; }
  .pstats span { color:var(--sage); font-size:15px; }
  .weekcard { background:var(--card); color:#F2F5EE; border-radius:24px; padding:20px 22px; margin-bottom:22px; }
  .weekcard small { color:#A3ADA4; font-size:12px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; }
  .weekcard .wrow { display:flex; justify-content:space-between; align-items:flex-end; margin:8px 0 14px; gap:12px; }
  .weekcard .big { font-size:48px; font-weight:900; letter-spacing:-.05em; line-height:1; } .weekcard .big em { font-style:normal; color:var(--lime); }
  .weekcard .big i { font-style:normal; color:#6F7A70; }
  .weekcard .right { text-align:right; } .weekcard .right b { font-size:34px; font-weight:900; letter-spacing:-.04em; display:block; line-height:1; }
  .weekcard .lbl { color:#A3ADA4; font-size:14px; }
  .segs { display:flex; gap:6px; } .segs i { flex:1; height:6px; border-radius:99px; background:#2E3730; } .segs i.on { background:var(--lime); }
  .tabs button { flex:1; }
  .ba { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }
  .ba figure { margin:0; position:relative; border-radius:22px; overflow:hidden; background:#DDE3D4; aspect-ratio:3/4; }
  .ba img { width:100%; height:100%; object-fit:cover; display:block; }
  .ba figcaption { position:absolute; left:12px; top:12px; background:rgba(17,22,15,.75); color:#fff; border-radius:99px; padding:5px 12px; font-size:13px; font-weight:800; letter-spacing:.06em; }
  .ba figcaption span { font-weight:600; letter-spacing:0; opacity:.8; margin-left:6px; }
  .bainfo { text-align:center; color:var(--sage); font-weight:600; margin:0 0 24px; }
  .grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; border-radius:18px; overflow:hidden; }
  .grid3 button { all:unset; cursor:pointer; position:relative; aspect-ratio:3/4; background:#DDE3D4; }
  .grid3 img { width:100%; height:100%; object-fit:cover; display:block; }
  .grid3 span { position:absolute; left:8px; bottom:8px; background:rgba(17,22,15,.7); color:#fff; font-size:12px; font-weight:700; border-radius:99px; padding:3px 9px; }
  .lightbox { position:fixed; inset:0; z-index:50; background:rgba(11,15,12,.94); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; }
  .lightbox img { max-width:100%; max-height:80vh; border-radius:18px; }
  .lightbox p { color:#F2F5EE; font-weight:700; margin:14px 0 0; text-align:center; }
  .lbclose { position:absolute; top:18px; right:18px; width:44px; height:44px; border-radius:50%; border:0; background:rgba(255,255,255,.14); color:#fff; font-size:18px; cursor:pointer; }
  .box { background:var(--white); border-radius:24px; padding:20px; margin-bottom:14px; box-shadow:0 1px 0 var(--line), 0 10px 30px rgba(17,22,15,.06); }
  .box h2 { font-size:20px; margin:0 0 4px; } .box .lead { color:var(--sage); margin:0 0 12px; font-size:15px; }
  .box .lead b { color:var(--dark); }
  .box svg { width:100%; display:block; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin:0 0 12px; }
  .chips button { border:1.5px solid var(--line); background:var(--cream); border-radius:99px; padding:7px 13px; font:inherit; font-size:14px; font-weight:700; cursor:pointer; color:var(--dark); }
  .chips button.on { background:var(--dark); color:var(--lime); border-color:var(--dark); }
  .recs { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr)); gap:8px; }
  .recs div { background:var(--cream); border-radius:16px; padding:12px 14px; }
  .recs b { display:block; font-size:15px; } .recs strong { display:block; font-size:20px; letter-spacing:-.03em; margin-top:2px; } .recs span { color:var(--sage); font-size:13px; }
  .srow { border-top:1px solid var(--line); padding:12px 0; cursor:pointer; }
  .srow:first-of-type { border-top:0; }
  .srow .h { display:flex; justify-content:space-between; gap:12px; } .srow .h b { font-size:16px; } .srow .h span { color:var(--sage); font-size:14px; white-space:nowrap; }
  .srow .d { display:none; margin-top:8px; } .srow.open .d { display:block; }
  .meas { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:10px; }
  .meas div { background:var(--cream); border-radius:16px; padding:14px; } .meas b { display:block; } .meas strong { font-size:24px; letter-spacing:-.03em; }
  .meas span { color:var(--sage); font-size:14px; margin-left:6px; }
  .foot2 { color:var(--sage); font-size:14px; text-align:center; margin-top:26px; }
  @media (max-width:640px) { .avatar { width:80px; height:80px; font-size:34px; } .weekcard .big { font-size:40px; } .weekcard .right b { font-size:28px; } }
  @media (max-width:640px) { .stats { grid-template-columns:1fr; } .stat b { font-size:26px; } }
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="./"><img src="img/logo.png" alt=""><b>kayam<span>.</span></b></a>
    <button class="pill hidden" id="logout" style="border:0;cursor:pointer;font-family:inherit">Se déconnecter</button>
  </div>
</header>

<!-- Connexion -->
<main class="narrow" id="loginView">
  <p class="kicker" data-t="kick">Mon compte</p>
  <h1 data-t="loginTitle">Connecte-toi à Kayam.</h1>
  <p class="sub" data-t="loginSub">Le même compte que dans l'app. Tu retrouves tes séances, tes records, tes repas et ton poids sur grand écran.</p>
  <div class="oauth">
    <button type="button" class="apple" id="appleBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.4 12.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.7-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9-1.7 0-3.3 1-4.2 2.6-1.8 3.1-.5 7.7 1.3 10.2.9 1.2 1.9 2.6 3.2 2.6 1.3-.1 1.8-.8 3.3-.8s2 .8 3.4.8c1.4 0 2.3-1.3 3.1-2.5 1-1.4 1.4-2.8 1.4-2.9-.1 0-2.7-1-2.7-4.1zM13.9 5c.7-.9 1.2-2 1.1-3.2-1 0-2.3.7-3 1.6-.7.8-1.3 2-1.1 3.1 1.1.1 2.3-.6 3-1.5z"/></svg><span data-t="apple">Continuer avec Apple</span></button>
    <button type="button" class="google" id="googleBtn"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.8 6C12.4 13.7 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.5 5.8c4.4-4 6.8-10 6.8-17.2z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.8-6C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.8-6z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4.2-13.5-9.9l-7.8 6C6.6 42.6 14.6 48 24 48z"/></svg><span data-t="google">Continuer avec Google</span></button>
  </div>
  <div class="or" data-t="or">ou avec ton e-mail</div>
  <form class="login" id="loginForm" novalidate>
    <input class="field" type="email" id="email" autocomplete="email" inputmode="email" placeholder="ton@email.com" data-ph="email" required>
    <input class="field" type="password" id="password" autocomplete="current-password" placeholder="Mot de passe" data-ph="password">
    <button class="btn" type="submit" id="loginBtn" data-t="login">Se connecter</button>
  </form>
  <p class="msg" id="loginMsg" role="status" aria-live="polite"></p>
  <p class="note"><span data-t="noPw">Mot de passe oublié ?</span><br>
    <button class="link" id="magic" data-t="magic">Recevoir un lien de connexion par e-mail</button></p>
</main>

<!-- Le compte : comme l'onglet Progrès de l'app -->
<main class="wide hidden" id="accountView">
  <div class="prof">
    <div class="avatar" id="avatar"></div>
    <div class="who">
      <h1 id="hello">Bonjour.</h1>
      <p class="sub" id="goalLine"></p>
    </div>
  </div>
  <div class="pstats" id="pstats"></div>
  <div class="weekcard" id="weekcard"></div>
  <div class="tabs" role="tablist" id="tabs">
    <button class="on" data-tab="photos" data-t="tPhotos">Photos</button>
    <button data-tab="bilan" data-t="tBilan">Bilan</button>
    <button data-tab="corps" data-t="tCorps">Corps</button>

  <section id="panel"></section>
  <p class="foot2"><span id="synced"></span> <button class="link" id="exportBtn" data-t="exportBtn">Exporter mes données</button></p>

<div class="lightbox hidden" id="lightbox" role="dialog" aria-modal="true">
  <button class="lbclose" id="lbclose" aria-label="Fermer">✕</button>
  <img id="lbimg" alt="">
  <p id="lbtext"></p>
</div>

<footer>
  <div class="wrap row">
    <div>© <span id="year">2026</span> Kayam</div>
    <div class="links">
      <a href="privacy.html" data-t="privacy">Confidentialité</a>
      <a href="mailto:kayam.support@gmail.com">Contact</a>
    </div>
  </div>
  <div class="bigname" aria-hidden="true">kayam<span>.</span></div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// Mon compte : lit la copie privée que l'app sauvegarde (table user_data, chacun ne lit que la sienne).
// Rien n'est modifié ici : on regarde seulement. Tout le texte est inséré en textContent (jamais en HTML).
const fr = (navigator.language || "fr").slice(0, 2) === "fr";
const T = fr ? {
  login:"Se connecter", busy:"Connexion…", bad:"E-mail ou mot de passe incorrect.", noEmail:"Écris d'abord ton e-mail.",
  sent:"C'est envoyé. Ouvre le lien reçu par e-mail sur cet appareil.", net:"Oups, ça n'a pas marché. Réessaie dans un instant.",
  hello:n => n ? `Bonjour, ${n}.` : "Bonjour.", synced:d => `Sauvegardé depuis l'app ${d}`, logout:"Se déconnecter",
  week:"Cette semaine", sessions:"séances", weight:"Poids", kcal:"Calories moyennes", per7:"sur les 7 derniers jours notés",
  noWeight:"Aucune pesée", noMeals:"Aucun repas noté", since:"depuis 2 semaines", goal:{"Build muscle":"Prise de masse","Lose fat":"Sèche","Get stronger":"Recomposition"},
  days:d => `${d} jours d'entraînement par semaine`,
  empty:"Rien ici pour l'instant. Ouvre Kayam sur ton iPhone, connecté à ce compte : tes données arrivent ici toutes seules.",
  sets:"séries", min:"min", best:"Meilleure série", date:"Date", exercise:"Exercice", eaten:"Mangé", protein:"Protéines", meals:"Repas",
  noRecords:"Tes records apparaîtront après tes premières séances avec des poids.",
  exportTitle:"Toutes tes données, dans un fichier", exportSub:"Séances, routines, repas, pesées, mensurations et profil, au format JSON. Le même export que dans l'app.",
  download:"Télécharger mes données", weightTitle:"Ton poids", lastWeighins:"Dernières pesées", meal:"repas", photos:"Tes photos de progrès restent privées dans l'app."
} : {
  login:"Sign in", busy:"Signing in…", bad:"Wrong email or password.", noEmail:"Enter your email first.",
  sent:"Sent. Open the link from the email on this device.", net:"Oops, that didn't work. Try again in a moment.",
  hello:n => n ? `Hi, ${n}.` : "Hi.", synced:d => `Saved from the app ${d}`, logout:"Sign out",
  week:"This week", sessions:"workouts", weight:"Weight", kcal:"Average calories", per7:"over the last 7 logged days",
  noWeight:"No weigh-ins", noMeals:"No meals logged", since:"over 2 weeks", goal:{"Build muscle":"Building muscle","Lose fat":"Losing fat","Get stronger":"Recomposition"},
  days:d => `${d} training days a week`,
  empty:"Nothing here yet. Open Kayam on your iPhone, signed in to this account: your data shows up here on its own.",
  sets:"sets", min:"min", best:"Best set", date:"Date", exercise:"Exercise", eaten:"Eaten", protein:"Protein", meals:"Meals",
  noRecords:"Your records will show up after your first workouts with weights.",
  exportTitle:"All your data, in one file", exportSub:"Workouts, routines, meals, weigh-ins, measurements and profile, as JSON. The same export as in the app.",
  download:"Download my data", weightTitle:"Your weight", lastWeighins:"Latest weigh-ins", meal:"meals", photos:"Your progress photos stay private in the app."
};
const EN_UI = { kick:"My account", loginTitle:"Sign in to Kayam.", loginSub:"The same account as in the app. See your workouts, records, meals and weight on a big screen.",
  login:"Sign in", noPw:"Forgot your password?", apple:"Continue with Apple", google:"Continue with Google", or:"or with your email", magic:"Get a sign-in link by email",
  tSessions:"Workouts", tRecords:"Records", tMeals:"Meals", tWeight:"Weight", tExport:"Export", privacy:"Privacy" };
if (!fr) {
  document.documentElement.lang = "en";
  document.querySelectorAll("[data-t]").forEach(el => { if (EN_UI[el.dataset.t]) el.textContent = EN_UI[el.dataset.t]; });
  document.getElementById("password").placeholder = "Password";
  document.getElementById("email").placeholder = "you@email.com";
}
document.getElementById("year").textContent = new Date().getFullYear();

const sb = supabase.createClient("https://ezkyuvdndslkoeiegorg.supabase.co", "sb_publishable_aYej0xP8FtfrjFsFMa6vFA_ISKcyu9I");
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const locale = fr ? "fr-FR" : "en-US";
const num = (v, d = 0) => Number(v).toLocaleString(locale, { maximumFractionDigits: d, minimumFractionDigits: 0 });
// Les dates de l'app = secondes depuis le 1er janvier 2001 (format Apple par défaut)
const appDate = t => typeof t === "number" ? new Date((t + 978307200) * 1000) : new Date(t);
const day = d => d.toLocaleDateString(locale, { weekday: "short", day: "numeric", month: "short" });
let NAMES = {};
fetch("exercise-names.json").then(r => r.json()).then(j => { NAMES = j; if (state) render(); }).catch(() => {});
const exName = n => (fr && NAMES[n] && NAMES[n][0]) || n;

let state = null, tab = "photos";

// ---------- Connexion ----------
const msg = (text, kind) => { $("loginMsg").textContent = text; $("loginMsg").className = "msg " + (kind || ""); };
$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  const email = $("email").value.trim(), password = $("password").value;
  if (!email || !password) { msg(fr ? "Écris ton e-mail et ton mot de passe." : "Enter your email and password.", "err"); return; }
  $("loginBtn").disabled = true; $("loginBtn").textContent = T.busy;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  $("loginBtn").disabled = false; $("loginBtn").textContent = T.login;
  if (error) msg(error.status === 400 ? T.bad : T.net, "err");
});
$("magic").addEventListener("click", async () => {
  const email = $("email").value.trim();
  if (!email) { msg(T.noEmail, "err"); $("email").focus(); return; }
  const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: false, emailRedirectTo: location.origin + "/compte.html" } });
  msg(error ? T.net : T.sent, error ? "err" : "ok");
});
// Apple et Google : on part chez eux, puis on revient ici connecté
for (const [id, provider] of [["appleBtn", "apple"], ["googleBtn", "google"]]) {
  $(id).addEventListener("click", async () => {
    // On vérifie d'abord que Supabase est prêt (sinon il affiche une page d'erreur brute)
    const { data, error } = await sb.auth.signInWithOAuth({ provider, options: { redirectTo: location.origin + "/compte.html", skipBrowserRedirect: true } });
    let ready = false;
    if (!error && data?.url) {
      try { const r = await fetch(data.url, { redirect: "manual" }); ready = r.type === "opaqueredirect" || (r.status >= 300 && r.status < 400); } catch {}
    }
    if (ready) { location.href = data.url; return; }
    if (true) msg(fr ? "Cette connexion n'est pas encore activée. Utilise ton e-mail pour l'instant." : "This sign-in isn't switched on yet. Use your email for now.", "err");
  });
}
// Retour d'Apple ou Google avec une erreur (dans l'adresse)
{
  const back = new URLSearchParams(location.hash.slice(1) || location.search.slice(1));
  if (back.get("error")) {
    msg(fr ? "La connexion n'a pas abouti. Réessaie, ou utilise ton e-mail." : "Sign-in didn't go through. Try again, or use your email.", "err");
    history.replaceState(null, "", location.pathname);
  }
}
$("logout").textContent = T.logout;
$("logout").addEventListener("click", async () => { await sb.auth.signOut(); state = null; show(false); });

function show(signedIn) {
  $("loginView").classList.toggle("hidden", signedIn);
  $("accountView").classList.toggle("hidden", !signedIn);
  $("logout").classList.toggle("hidden", !signedIn);
}

sb.auth.onAuthStateChange((_event, session) => {
  if (session) { show(true); if (!state) load(session.user); }
  else show(false);
});

// ---------- Les données (comme l'onglet Progrès de l'app) ----------
const A = fr ? {
  sessions:"séances", photos:"photos", records:"records", week:"Cette semaine", thisWeek:"cette semaine",

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[c]);
const signed = d => `${d > 0 ? "+" : d < 0 ? "−" : ""}${num(Math.abs(d), 1)}`;
const goalPerWeek = { "1 to 2": 2, "3 to 4": 4, "5 or more": 5 };

async function load(user) {
  const { data, error } = await sb.from("user_data").select("kind, data, updated_at");
  const rows = error ? [] : (data || []);
  const by = Object.fromEntries(rows.map(r => [r.kind, r]));
  const meta = user.user_metadata || {};
  const workouts = by.workouts?.data || {};
  const arr = v => Array.isArray(v) ? v : [];
  state = {
    uid: user.id, meta, rows, urls: {}, imagesLoaded: false,
    imperial: meta.units === "lbs",
    history: arr(workouts.history).filter(s => s.endedAt).sort((a, b) => b.startedAt - a.startedAt),
    days: by.meals?.data?.days || {},
    weighIns: arr(by.weighins?.data).slice().sort((a, b) => a.date - b.date),
    photos: arr(by.photos?.data).slice().sort((a, b) => b.date - a.date),
    measures: arr(by.measurements?.data).slice().sort((a, b) => a.date - b.date),
    updated: rows.map(r => new Date(r.updated_at)).sort((a, b) => b - a)[0]
  };
  state.best = bestSets();
  render();
  loadImages();
}

// Les photos sont dans l'espace privé : des liens valables 1 heure, pour toi seul
async function loadImages() {
  const paths = state.photos.map(p => `${state.uid}/progress/${p.id}.jpg`);
  paths.push(`${state.uid}/profile/profile.jpg`);
  const { data } = await sb.storage.from("kayam-photos").createSignedUrls(paths, 3600);
  for (const d of data || []) if (d.signedUrl && !d.error) state.urls[d.path] = d.signedUrl;
  state.imagesLoaded = true;
  render();
}
const photoURL = p => state.urls[`${state.uid}/progress/${p.id}.jpg`];

function bestSets() {
  const best = {};
  for (const s of state.history) for (const e of s.exercises || []) for (const x of e.sets || []) {
    if (!isWork(x) || !x.kg || !x.reps) continue;
    const b = best[e.exerciseName];
    if (!b || x.kg > b.kg || (x.kg === b.kg && x.reps > b.reps)) best[e.exerciseName] = { kg: x.kg, reps: x.reps, date: appDate(s.startedAt) };
  }
  return best;
}

const unit = () => state.imperial ? "lbs" : "kg";
const w = kg => state.imperial ? kg * 2.20462 : kg;
const isWork = s => s.done && s.kind !== "warmup";
const mealKcal = m => m.ateOut ? ({ small: 500, medium: 800, large: 1200 })[m.ateOut] : (m.foods || []).reduce((a, f) => a + f.food.kcal * f.grams / 100, 0);
const mealProt = m => m.ateOut ? ({ small: 25, medium: 35, large: 45 })[m.ateOut] : (m.foods || []).reduce((a, f) => a + f.food.protein * f.grams / 100, 0);
const monday = d => { const m = new Date(d); m.setHours(0, 0, 0, 0); m.setDate(m.getDate() - ((m.getDay() + 6) % 7)); return m; };

function render() {
  const m = state.meta;
  $("hello").innerHTML = `${esc(m.first_name || (fr ? "Toi" : "You"))}<span>.</span>`;
  const goal = [A.goal[m.goal], goalPerWeek[m.days_per_week] ? A.perWeek(String(m.days_per_week).replace(" to ", fr ? " à " : " to ").replace("5 or more", fr ? "5 ou plus" : "5+")) : null].filter(Boolean);
  $("goalLine").textContent = goal.join(" · ");
  const av = $("avatar"), url = state.urls[`${state.uid}/profile/profile.jpg`];
  av.replaceChildren();
  if (url) { const i = el("img"); i.src = url; i.alt = ""; av.append(i); } else av.textContent = (m.first_name || "K").slice(0, 1).toUpperCase();
  const stat = (n, l) => { const d = el("div"); d.append(el("b", null, String(n)), el("span", null, l)); return d; };
  $("pstats").replaceChildren(stat(state.history.length, A.sessions), stat(state.photos.length, A.photos), stat(Object.keys(state.best).length, A.records));
  renderWeek();
  $("synced").textContent = state.updated ? A.synced(state.updated.toLocaleDateString(locale, { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" })) : "";
  renderTab();
}

function renderWeek() {
  const start = monday(new Date()), goal = goalPerWeek[state.meta.days_per_week] || 3;
  const done = state.history.filter(s => appDate(s.startedAt) >= start).length;
  const ws = state.weighIns.filter(x => appDate(x.date) >= start), before = state.weighIns.filter(x => appDate(x.date) < start).pop();
  const lastW = ws[ws.length - 1];
  const change = lastW && (before || ws.length > 1) ? w(lastW.kg) - w((before || ws[0]).kg) : null;
  const c = $("weekcard"); c.replaceChildren();
  c.append(el("small", null, A.week));
  const row = el("div", "wrow"), left = el("div"), right = el("div", "right");
  left.innerHTML = `<div class="big"><em>${done}</em><i>/${goal}</i></div><div class="lbl">${esc(A.sessions)}</div>`;
  if (change != null) right.innerHTML = `<b>${signed(change)}</b><div class="lbl">${unit()} ${esc(A.thisWeek)}</div>`;
  row.append(left, right); c.append(row);
  const segs = el("div", "segs");
  for (let i = 0; i < goal; i++) segs.append(el("i", i < done ? "on" : null));
  c.append(segs);
}

$("tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]"); if (!b) return;
  tab = b.dataset.tab;
  document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b));
  renderTab();
});
function renderTab() { const p = $("panel"); p.replaceChildren(); ({ photos: photosTab, bilan: bilanTab, corps: corpsTab })[tab](p); }
const emptyBox = (p, text) => p.append(el("p", "empty", text));
function box(title, lead) { const b = el("div", "box"); b.append(el("h2", null, title)); if (lead) { const l = el("p", "lead"); l.innerHTML = lead; b.append(l); } return b; }

// ---------- Photos : avant / après, puis la grille ----------
function photosTab(p) {
  const ph = state.photos;
  if (!ph.length) return emptyBox(p, A.noPhotos);
  if (!state.imagesLoaded) p.append(el("p", "note", A.loading));
  if (ph.length >= 2) {
    const first = ph[ph.length - 1], last = ph[0];
    const ba = el("div", "ba");
    for (const [photo, label] of [[first, A.before], [last, A.after]]) {
      const f = el("figure"), url = photoURL(photo);
      if (url) { const i = el("img"); i.src = url; i.alt = label; f.append(i); }
      const cap = el("figcaption", null, label); cap.append(el("span", null, appDate(photo.date).toLocaleDateString(locale, { day: "numeric", month: "short" })));
      f.append(cap); ba.append(f);
    }
    p.append(ba);
    const weeks = Math.max(1, Math.round((appDate(last.date) - appDate(first.date)) / (7 * 864e5)));
    const near = t => state.weighIns.reduce((b, x) => !b || Math.abs(appDate(x.date) - t) < Math.abs(appDate(b.date) - t) ? x : b, null);
    const a = near(appDate(first.date)), b = near(appDate(last.date));
    const kg = a && b && a !== b ? `${signed(w(b.kg) - w(a.kg))} ${unit()}` : "";
    p.append(el("p", "bainfo", A.apart(A.weeks(weeks), kg)));
  }
  const grid = el("div", "grid3");
  for (const photo of ph) {
    const b = el("button"), url = photoURL(photo);
    if (url) { const i = el("img"); i.src = url; i.alt = ""; i.loading = "lazy"; b.append(i); }
    b.append(el("span", null, appDate(photo.date).toLocaleDateString(locale, { day: "numeric", month: "short" })));
    b.addEventListener("click", () => openPhoto(photo));
    grid.append(b);
  }
  p.append(grid);
}
function openPhoto(photo) {
  const url = photoURL(photo); if (!url) return;
  const s = state.history.find(x => x.id === photo.sessionID);
  $("lbimg").src = url;
  $("lbtext").textContent = [appDate(photo.date).toLocaleDateString(locale, { weekday: "long", day: "numeric", month: "long", year: "numeric" }), s?.name].filter(Boolean).join(" · ");
  $("lightbox").classList.remove("hidden");
}
const closePhoto = () => $("lightbox").classList.add("hidden");
$("lbclose").addEventListener("click", closePhoto);
$("lightbox").addEventListener("click", e => { if (e.target.id === "lightbox") closePhoto(); });
addEventListener("keydown", e => { if (e.key === "Escape") closePhoto(); });

// ---------- Les graphiques (dessinés à la main, aux couleurs de l'app) ----------
const NS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs, text) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; return e; }
// La largeur réelle de l'écran : le texte des graphiques garde sa taille sur téléphone
const chartW = () => Math.max(300, Math.min(900, ($("panel").clientWidth || 800) - 40));
function lineChart(pts, fmt) {
  const W = chartW(), H = 240, L = 48, R = 16, Tp = 14, B = 30;
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });
  const xs = pts.map(p => p.x.getTime()), ys = pts.map(p => p.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs, x0 + 864e5);
  const pad = Math.max((Math.max(...ys) - Math.min(...ys)) * 0.15, 0.5);
  const lo = Math.min(...ys) - pad, hi = Math.max(...ys) + pad;
  const X = t => L + (t - x0) / (x1 - x0) * (W - L - R), Y = v => Tp + (1 - (v - lo) / (hi - lo)) * (H - Tp - B);
  for (const v of [hi - pad, (hi + lo) / 2, lo + pad]) {
    svg.append(svgEl("line", { x1: L, x2: W - R, y1: Y(v), y2: Y(v), stroke: "rgba(17,22,15,.08)" }));
    svg.append(svgEl("text", { x: L - 8, y: Y(v) + 4, "text-anchor": "end", "font-size": 13, fill: "#5E685F" }, fmt(v)));
  }
  const d = pts.map((p, i) => `${i ? "L" : "M"}${X(p.x.getTime()).toFixed(1)},${Y(p.y).toFixed(1)}`).join(" ");
  svg.append(svgEl("path", { d: `${d} L${X(xs[xs.length - 1]).toFixed(1)},${H - B} L${X(xs[0]).toFixed(1)},${H - B} Z`, fill: "rgba(204,237,120,.35)" }));
  svg.append(svgEl("path", { d, fill: "none", stroke: "#4C7420", "stroke-width": 3, "stroke-linejoin": "round", "stroke-linecap": "round" }));
  const last = pts[pts.length - 1];
  svg.append(svgEl("circle", { cx: X(last.x.getTime()), cy: Y(last.y), r: 6, fill: "#11160F", stroke: "#CCED78", "stroke-width": 3 }));
  const dfmt = t => new Date(t).toLocaleDateString(locale, { day: "numeric", month: "short" });
  svg.append(svgEl("text", { x: L, y: H - 8, "font-size": 13, fill: "#5E685F" }, dfmt(x0)));
  svg.append(svgEl("text", { x: W - R, y: H - 8, "font-size": 13, fill: "#5E685F", "text-anchor": "end" }, dfmt(xs[xs.length - 1])));
  return svg;
}
function barChart(items) {
  const W = chartW(), H = 210, B = 28, Tp = 22, gap = W < 500 ? 4 : 8;
  const narrow = W / items.length < 46;
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });
  const max = Math.max(1, ...items.map(i => i.v)), bw = (W - gap * (items.length - 1)) / items.length;
  items.forEach((it, i) => {
    const x = i * (bw + gap), h = it.v / max * (H - B - Tp);
    svg.append(svgEl("rect", { x, y: Tp, width: bw, height: H - B - Tp, rx: 8, fill: "rgba(17,22,15,.05)" }));
    if (it.v > 0) {
      svg.append(svgEl("rect", { x, y: H - B - h, width: bw, height: h, rx: 8, fill: it.hi ? "#CCED78" : "#11160F" }));
      if (!narrow || it.hi || i === 0 || items.length - i <= 1 || !it.text)
        svg.append(svgEl("text", { x: x + bw / 2, y: H - B - h - 6, "text-anchor": "middle", "font-size": narrow ? 11 : 13, "font-weight": 700, fill: "#11160F" }, it.text ?? String(it.v)));
    }
    const edge = i === 0 ? ["start", x] : i === items.length - 1 ? ["end", x + bw] : ["middle", x + bw / 2];
    if (!narrow || i % 3 === 0 || it.hi) svg.append(svgEl("text", { x: edge[1], y: H - 8, "text-anchor": edge[0], "font-size": 12, fill: it.hi ? "#11160F" : "#5E685F", "font-weight": it.hi ? 800 : 400 }, it.label));
  });
  return svg;
}

// ---------- Bilan : séances par semaine, force, calories, records, séances ----------
function bilanTab(p) {
  if (!state.history.length && !Object.keys(state.days).length) return emptyBox(p, A.noSessions);
  // Séances par semaine (12 semaines)
  const start = monday(new Date()), weeks = [];
  for (let i = 11; i >= 0; i--) {
    const a = new Date(start); a.setDate(a.getDate() - 7 * i); const b = new Date(a); b.setDate(b.getDate() + 7);
    weeks.push({ v: state.history.filter(s => { const d = appDate(s.startedAt); return d >= a && d < b; }).length,
                 label: a.toLocaleDateString(locale, { day: "numeric", month: "numeric" }), hi: i === 0 });
  }
  const avg = weeks.reduce((a, x) => a + x.v, 0) / weeks.length;
  const b1 = box(A.perWeekTitle, A.avg(num(avg, 1))); b1.append(barChart(weeks)); p.append(b1);

  // Force : les exercices les plus faits, la meilleure série de chaque séance
  const count = {};
  for (const s of state.history) for (const e of s.exercises || []) if ((e.sets || []).some(x => isWork(x) && x.kg)) count[e.exerciseName] = (count[e.exerciseName] || 0) + 1;
  const top = Object.keys(count).filter(n => count[n] >= 2).sort((a, b) => count[b] - count[a]).slice(0, 6);
  const b2 = box(A.strength);
  if (!top.length) b2.append(el("p", "lead", A.noStrength));
  else {
    const chips = el("div", "chips"), lead = el("p", "lead"), holder = el("div");
    const pick = name => {
      chips.querySelectorAll("button").forEach(c => c.classList.toggle("on", c.dataset.n === name));
      const pts = state.history.slice().reverse().map(s => {
        const e = (s.exercises || []).find(x => x.exerciseName === name);
        const top = e ? Math.max(0, ...(e.sets || []).filter(x => isWork(x) && x.kg).map(x => x.kg)) : 0;
        return top ? { x: appDate(s.startedAt), y: w(top) } : null;
      }).filter(Boolean);
      const a = pts[0].y, z = pts[pts.length - 1].y;
      lead.innerHTML = A.strengthLead(esc(exName(name)), `${num(a, 1)} ${unit()}`, `${num(z, 1)} ${unit()}`, `${signed(z - a)} ${unit()}`);
      holder.replaceChildren(lineChart(pts, v => num(v, 0)));
    };
    for (const n of top) { const c = el("button", null, exName(n)); c.dataset.n = n; c.addEventListener("click", () => pick(n)); chips.append(c); }
    b2.append(chips, lead, holder); pick(top[0]);
  }
  p.append(b2);

  // Calories mangées (14 derniers jours notés)
  const keys = Object.keys(state.days).sort().filter(k => (state.days[k] || []).some(x => x.status === "confirmed")).slice(-14);
  const b3 = box(A.kcal);
  if (!keys.length) b3.append(el("p", "lead", A.noKcal));
  else {
    const items = keys.map(k => {
      const eaten = state.days[k].filter(x => x.status === "confirmed"); const [y, mo, d] = k.split("-").map(Number);
      return { v: Math.round(eaten.reduce((a, x) => a + mealKcal(x), 0)), p: eaten.reduce((a, x) => a + mealProt(x), 0),
               label: new Date(y, mo - 1, d).toLocaleDateString(locale, { day: "numeric", month: "numeric" }) };
    });
    items.forEach(i => i.text = num(i.v));
    const l = el("p", "lead"); l.innerHTML = A.kcalLead(num(Math.round(items.reduce((a, i) => a + i.v, 0) / items.length)), num(Math.round(items.reduce((a, i) => a + i.p, 0) / items.length)));
    b3.append(l, barChart(items));
  }
  p.append(b3);

  // Records
  const names = Object.keys(state.best).sort((a, b) => state.best[b].date - state.best[a].date);
  if (names.length) {
    const b4 = box(A.recs), recs = el("div", "recs");
    for (const n of names.slice(0, 12)) {
      const r = el("div"), x = state.best[n];
      r.append(el("b", null, exName(n)), el("strong", null, `${num(w(x.kg), 1)} ${unit()} × ${x.reps}`), el("span", null, day(x.date)));
      recs.append(r);
    }
    b4.append(recs); p.append(b4);
  }

  // Dernières séances (toucher pour le détail)
  if (state.history.length) {
    const b5 = box(A.recent);
    for (const s of state.history.slice(0, 10)) {
      const r = el("div", "srow"), h = el("div", "h"), d = el("div", "d");
      const nSets = (s.exercises || []).reduce((a, e) => a + (e.sets || []).filter(isWork).length, 0);
      const mins = Math.max(1, Math.round((appDate(s.endedAt) - appDate(s.startedAt)) / 60000));
      h.append(el("b", null, s.name || "—"), el("span", null, `${day(appDate(s.startedAt))} · ${mins} ${A.min} · ${nSets} ${A.sets}`));
      for (const e of s.exercises || []) {
        const work = (e.sets || []).filter(isWork); if (!work.length) continue;
        const ex = el("div", "ex");
        ex.append(el("b", null, exName(e.exerciseName)), el("span", null, work.map(x => x.kg ? `${num(w(x.kg), 1)} × ${x.reps ?? "–"}` : x.seconds ? `${Math.round(x.seconds / 60)} ${A.min}` : `× ${x.reps ?? "–"}`).join(" · ")));
        d.append(ex);
      }
      r.append(h, d); r.addEventListener("click", () => r.classList.toggle("open"));
      b5.append(r);
    }
    p.append(b5);
  }
}

// ---------- Corps : poids et mensurations ----------
function corpsTab(p) {
  const ws = state.weighIns;
  const b1 = box(A.weightTitle);
  if (!ws.length) b1.append(el("p", "lead", A.noWeight));
  else {
    const a = w(ws[0].kg), z = w(ws[ws.length - 1].kg);
    const l = el("p", "lead"); l.innerHTML = A.weightLead(`${num(a, 1)} ${unit()}`, `${num(z, 1)} ${unit()}`, `${signed(z - a)} ${unit()}`);
    b1.append(l);
    if (ws.length >= 2) b1.append(lineChart(ws.map(x => ({ x: appDate(x.date), y: w(x.kg) })), v => num(v, 1)));
  }
  p.append(b1);
  const b2 = box(A.measTitle), ms = state.measures;
  const parts = ["waist", "chest", "arm", "thigh", "hips"].filter(k => ms.some(m => m.cm && m.cm[k]));
  if (!parts.length) b2.append(el("p", "lead", A.noMeas));
  else {
    const grid = el("div", "meas"), len = cm => state.imperial ? cm / 2.54 : cm, lu = state.imperial ? "in" : "cm";
    for (const k of parts) {
      const vals = ms.filter(m => m.cm && m.cm[k]).map(m => len(m.cm[k]));
      const c = el("div"); c.append(el("b", null, A.parts[k]));
      const v = el("strong", null, `${num(vals[vals.length - 1], 1)} ${lu}`); c.append(v);
      if (vals.length > 1) c.append(el("span", null, `${signed(vals[vals.length - 1] - vals[0])} ${lu} ${A.since}`));
      grid.append(c);
    }
    b2.append(grid);
  }
  p.append(b2);
}

let resizeTimer; addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => state && renderTab(), 200); });

// ---------- Export ----------
$("exportBtn").addEventListener("click", () => {
  if (!state) return;
  const out = { exportedAt: new Date().toISOString(), profile: state.meta };
  for (const r of state.rows) out[r.kind] = r.data;
  const url = URL.createObjectURL(new Blob([JSON.stringify(out, null, 2)], { type: "application/json" }));
  const a = document.createElement("a"); a.href = url; a.download = `kayam-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
});
</script>
</body>
