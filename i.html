<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Kayam · Invitation</title>
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F5F6F1">
<link rel="icon" href="img/logo.png">
<link rel="stylesheet" href="site.css">
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="./"><img src="img/logo.png" alt=""><b>kayam<span>.</span></b></a>
    <a class="pill" href="./#fin" id="topcta">Préviens-moi</a>
  </div>
</header>
<main class="narrow">
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
  <div class="card"><div class="code" id="code"></div></div>
  <a class="btn" id="open" href="#"></a>
  <p class="note" id="note"></p>
</main>
<footer>
  <div class="wrap row">
    <div>© <span id="year">2026</span> Kayam</div>
    <div class="links">
      <a href="privacy.html" id="flink1">Confidentialité</a>
      <a href="compte.html">Mon compte</a>
      <a href="mailto:kayam.support@gmail.com" id="flink2">Contact</a>
    </div>
  </div>
  <div class="bigname" aria-hidden="true">kayam<span>.</span></div>
</footer>
<script>
document.getElementById("year").textContent = new Date().getFullYear();
if ((navigator.language || "fr").slice(0, 2) !== "fr") {
  document.getElementById("topcta").textContent = "Notify me";
  document.getElementById("flink1").textContent = "Privacy";
}
</script>
<script>
const lang = (navigator.language || "en").slice(0, 2);
const T = {
  fr: { title: "Rejoins mon cercle Kayam", sub: "On s'encourage entre amis : qui s'est entraîné aujourd'hui, et un 👊 pour se motiver.", open: "Ouvrir dans Kayam", note: "Ou tape ce code dans Kayam : Progrès → Amis. Pas encore Kayam ? <a href=\"./#fin\">Préviens-moi au lancement</a>." },
  he: { title: "הצטרף למעגל ה־Kayam שלי", sub: "מעודדים אחד את השני: מי התאמן היום, ו־👊 למוטיבציה.", open: "פתח ב־Kayam", note: "או הקלד את הקוד ב־Kayam: התקדמות ← חברים. עוד אין לך Kayam? <a href=\"./#fin\">קבל עדכון בהשקה</a>." },
  en: { title: "Join my Kayam circle", sub: "We cheer each other on: who trained today, and a 👊 to stay motivated.", open: "Open in Kayam", note: "Or enter this code in Kayam: Progress → Friends. No Kayam yet? <a href=\"./#fin\">Get notified at launch</a>." }
}[lang] || null;
const t = T || { title: "Join my Kayam circle", sub: "We cheer each other on: who trained today, and a 👊 to stay motivated.", open: "Open in Kayam", note: "Or enter this code in Kayam: Progress → Friends. No Kayam yet? <a href=\"./#fin\">Get notified at launch</a>." };
if (lang === "he") document.documentElement.dir = "rtl";
const code = location.hash.slice(1).toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 16);
const $ = id => document.getElementById(id);
$("title").textContent = t.title;
$("sub").textContent = t.sub;
$("code").textContent = code || "—";
$("open").textContent = t.open;
$("open").href = "kayam://invite/" + code;
$("note").innerHTML = t.note;
</script>
</body>
</html>
