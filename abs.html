<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kayam · Top 4 Abs</title>
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F5F6F1">
<link rel="icon" href="img/logo.png">
<link rel="stylesheet" href="site.css">
<style>
  .kicker { margin-bottom:6px; }
  .ex { display:flex; gap:14px; align-items:flex-start; }
  .num { flex:none; width:38px; height:38px; border-radius:12px; background:var(--lime); color:var(--ink);
         font-weight:900; font-size:18px; display:grid; place-items:center; }
  .ex h2 { margin:2px 0 4px; }
  .dose { display:inline-block; font-weight:800; font-size:14px; color:var(--green); margin-bottom:6px; }
  .cue { margin:0; color:var(--sage); font-size:15px; line-height:1.45; }
  .how { background:var(--dark); color:var(--cream); }
  .how h2 { color:var(--lime); }
  .how p { margin:6px 0 0; font-size:15px; line-height:1.5; }
  .btn.alt { background:var(--lime); color:var(--ink) !important; margin-top:10px; }
  main.narrow { padding-bottom:40px; }
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="./"><img src="img/logo.png" alt=""><b>kayam<span>.</span></b></a>
    <a class="pill" id="topcta" href="https://apps.apple.com/app/id6819856907"></a>
  </div>
</header>
<main class="narrow">
  <p class="kicker" id="kicker"></p>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
  <div id="list"></div>
  <div class="card how">
    <h2 id="howT"></h2>
    <p id="how1"></p>
    <p id="how2"></p>
  </div>
  <a class="btn" id="get" href="https://apps.apple.com/app/id6819856907"></a>
  <a class="btn alt" id="open" href="kayam://routine#q1YqU7Iy1FEqUrKKrlbKU7JSCskvUDBRcEwqVtJRSgWLVgBFPRLz0jPz0hV8UtMVghIzi1OBssVg2QKgfoNaHQxGLNhQM7AIyATnxKScVAXnotK85AwUzUYwPUgMdM0uqYkpCk6l6SgazWDqkRgQjSamMI3BmSmpCgE5iXnZcK3FqclKVsZgo7Ew4QbEAiEA"></a>
  <p class="note" id="note"></p>
</main>
<footer>
  <div class="wrap row">
    <div>© <span id="year">2026</span> Kayam</div>
    <div class="links">
      <a href="privacy.html" id="flink1">Privacy</a>
      <a href="mailto:kayam.support@gmail.com">Contact</a>
    </div>
  </div>
  <div class="bigname" aria-hidden="true">kayam<span>.</span></div>
</footer>
<script>
document.getElementById("year").textContent = new Date().getFullYear();
const TXT = {
  en: {
    cta: "Get the app", kicker: "FREE · ABS", title: "Top 4 abs exercises",
    sub: "Do it 2–3 times a week, at the end of your workout. About 12 minutes.",
    ex: [
      ["Hanging leg raise", "3 × 10 · rest 60 s", "Hang from a bar, lift your legs without swinging. Go slow on the way down."],
      ["Cable crunch", "3 × 12 · rest 60 s", "Kneel, rope behind your head. Curl your chest toward your hips, not your head to the floor."],
      ["Dead bug", "3 × 16 (8 per side) · rest 45 s", "Lower back glued to the floor. Opposite arm and leg go out, slowly."],
      ["Side plank", "3 × 30 s per side · rest 45 s", "Body in one straight line, hips up. Breathe."]
    ],
    howT: "The honest part",
    how1: "Abs get stronger with training. To see them, your body fat has to go down too, and that comes from your food.",
    how2: "Each week, add 1–2 reps or a bit of weight. Small steps, every week.",
    get: "Get Kayam (free)", open: "I have Kayam → add this workout",
    note: "Kayam tracks your sets, your meals and your progress, for any goal."
  },
  fr: {
    cta: "L'app", kicker: "GRATUIT · ABDOS", title: "Le top 4 des exercices abdos",
    sub: "2 à 3 fois par semaine, à la fin de ta séance. Environ 12 minutes.",
    ex: [
      ["Relevés de jambes suspendu", "3 × 10 · repos 60 s", "Suspendu à une barre, monte les jambes sans te balancer. Redescends lentement."],
      ["Crunch à la poulie", "3 × 12 · repos 60 s", "À genoux, corde derrière la tête. Enroule la poitrine vers le bassin, ne tire pas avec les bras."],
      ["Dead bug", "3 × 16 (8 par côté) · repos 45 s", "Bas du dos collé au sol. Bras et jambe opposés s'éloignent, lentement."],
      ["Gainage latéral", "3 × 30 s par côté · repos 45 s", "Corps bien droit, hanches hautes. Respire."]
    ],
    howT: "La partie honnête",
    how1: "Les abdos se renforcent à l'entraînement. Pour les voir, il faut aussi baisser le gras, et ça se joue dans l'assiette.",
    how2: "Chaque semaine, ajoute 1 ou 2 répétitions ou un peu de charge. Petit à petit.",
    get: "Télécharger Kayam (gratuit)", open: "J'ai Kayam → ajouter cette séance",
    note: "Kayam suit tes séries, tes repas et tes progrès, quel que soit ton objectif."
  },
  he: {
    cta: "להורדה", kicker: "חינם · בטן", title: "4 התרגילים הכי טובים לבטן",
    sub: "2–3 פעמים בשבוע, בסוף האימון. בערך 12 דקות.",
    ex: [
      ["הרמות רגליים בתלייה", "3 × 10 · מנוחה 60 שנ׳", "תלוי על מתח, מרים רגליים בלי להתנדנד. יורד לאט."],
      ["כפיפות בטן בכבל", "3 × 12 · מנוחה 60 שנ׳", "על הברכיים, חבל מאחורי הראש. מגלגל את החזה לכיוון האגן, לא מושך עם הידיים."],
      ["דד באג", "3 × 16 (8 לכל צד) · מנוחה 45 שנ׳", "גב תחתון צמוד לרצפה. יד ורגל נגדיות יוצאות, לאט."],
      ["פלאנק צידי", "3 × 30 שנ׳ לכל צד · מנוחה 45 שנ׳", "גוף בקו ישר, אגן למעלה. לנשום."]
    ],
    howT: "החלק הכנה",
    how1: "הבטן מתחזקת באימון. כדי לראות אותה צריך גם להוריד שומן, וזה קורה בצלחת.",
    how2: "כל שבוע מוסיפים 1–2 חזרות או קצת משקל. צעד קטן כל שבוע.",
    get: "להוריד את Kayam (חינם)", open: "יש לי Kayam ← להוסיף את האימון",
    note: "Kayam עוקבת אחרי הסטים, הארוחות וההתקדמות שלך, לכל מטרה."
  }
};
const lang = (navigator.language || "en").slice(0, 2);
const T = TXT[lang] || TXT.en;
if (lang === "he") document.documentElement.dir = "rtl";
document.documentElement.lang = TXT[lang] ? lang : "en";
const $ = id => document.getElementById(id);
for (const k of ["kicker", "title", "sub", "howT", "how1", "how2", "get", "open", "note"]) $(k).textContent = T[k];
$("topcta").textContent = T.cta;
if (lang === "fr") $("flink1").textContent = "Confidentialité";
T.ex.forEach(([name, dose, cue], i) => {
  const card = document.createElement("div");
  card.className = "card ex";
  card.innerHTML = `<div class="num">${i + 1}</div><div><h2></h2><span class="dose"></span><p class="cue"></p></div>`;
  card.querySelector("h2").textContent = name;
  card.querySelector(".dose").textContent = dose;
  card.querySelector(".cue").textContent = cue;
  $("list").appendChild(card);
});
</script>
</body>
</html>
